name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gotical/OpenWRT_Global
          path: upstream

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore original openwrt_service.dart and apply patch
        run: |
          cp upstream/source/lib/services/openwrt_service.dart source/lib/services/openwrt_service.dart
          cd source
          sed -i '/aapt2FromMavenOverride/d' android/gradle.properties
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              extensions.findByType<com.android.build.api.variant.AndroidComponentsExtension<*, *, *>>()?.finalizeDsl { ext ->
                  ext.compileSdk = 36
              }
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          EOF
          python3 -c "
          p = 'lib/services/openwrt_service.dart'
          s = open(p, encoding='utf-8').read()
          old = 'final fp = utf8.decode(fpBytes);'
          new = 'String fp; try { fp = utf8.decode(fpBytes); } catch (_) { fp = fpBytes.map((b) => b.toRadixString(16).padLeft(2, \"0\")).join(\":\"); }'
          assert old in s, 'Target line not found'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          "

      - name: Get dependencies and build APK
        working-directory: ./source
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-global-25.12
          path: source/build/app/outputs/flutter-apk/app-release.apk
